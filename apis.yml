aid: deepip
name: DeepIP
description: >-
  DeepIP is an AI-powered patent intelligence platform that streamlines the full
  patent lifecycle for intellectual-property professionals, automating repetitive
  work while keeping a human in the loop. It supports invention capture,
  patentability assessment, patent drafting and drawings generation, AI review,
  prosecution support, freedom-to-operate (FTO) and invalidity searches, portfolio
  and landscape intelligence, and agentic prior-art search. DeepIP embeds directly
  into Microsoft Word, IP management systems, and the web browser, and works across
  chemistry, biology, software, mechanical, and electronic domains and multiple
  patent jurisdictions (USPTO, EPO, PCT, UKIPO, CNIPA, KIPO, and others). The
  company operates a zero-data-retention policy on U.S.-based Microsoft Azure and
  holds SOC 2 Type II, ISO 27001, ISO 42001, and GDPR compliance. DeepIP is backed
  by Balderton Capital.
