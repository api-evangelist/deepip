x-notes:
  api_reference: >-
    DeepIP's API reference is a ReadMe project at https://docs.deepip.ai/ (CNAME
    getdavinci-f5dd75ed.readmessl.com — "getdavinci" is DeepIP's former product
    name, DaVinci). Every path redirects to https://dash.readme.com/to/getdavinci,
    a ReadMe login, and robots.txt there is Disallow: /. No Documentation,
    APIReference or DeveloperPortal pointer is emitted, because nothing on that
    host is publicly readable. DeepIP's own security page advertises "a
    comprehensive, well-documented API" but publishes no URL for it.
  agent_skills: >-
    The DeepIP GitHub organization publishes one public repository,
    deepip-ai/lenny-skills — 86 Agent Skills for Claude Code drawn from Lenny's
    Podcast. They are real, first-party Agent Skills but they teach product
    management, not DeepIP's API, so no AgentSkill pointer is emitted for them.
  no_agent_card: >-
    app.deepip.ai answers 401 for every unmapped /.well-known/* path, including
    agent-card.json and agent.json. That is the MCP bearer-auth middleware, not an
    A2A card, and is recorded as a miss. www.deepip.ai returns 404 on both paths.
