apis:
- name: DeepIP MCP Server
  description: >-
    A remote Model Context Protocol server operated by DeepIP at
    https://app.deepip.ai/mcp, letting an MCP-capable agent act inside a DeepIP
    tenant on behalf of a signed-in user. It is protected by OAuth 2.0
    authorization-code with PKCE (S256) and advertises itself through RFC 9728
    protected-resource metadata and RFC 8414 authorization-server metadata, both
    of which resolve anonymously. The tool set is not public — tools/list and
    initialize return 401 MISSING_CREDENTIALS without a bearer token — and DeepIP
    documents the server nowhere on its public site; it was found by probing the
    application host. The endpoint is recorded because it was verified live, not
    because it is advertised.
  humanURL: https://docs.deepip.ai/
  baseURL: https://app.deepip.ai/mcp
