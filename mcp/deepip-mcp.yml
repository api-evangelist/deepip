notes: >-
  This is an undocumented-but-live agent surface. DeepIP's public security page
  says "Build custom integrations with a comprehensive, well-documented API" but
  publishes no URL for it, and nothing on deepip.ai, in its GitHub organization,
  or in the public record mentions MCP. The endpoint was found by probing the
  application host: the 401 on app.deepip.ai carried an RFC 9728
  WWW-Authenticate resource_metadata pointer, and that metadata document resolves
  anonymously to the MCP resource and its authorization server. The server is
  reachable by any MCP client that can complete the OAuth authorization-code +
  PKCE flow with a DeepIP account — it is a remote endpoint, not a stdio package.
