tools_note: >-
  UNKNOWN — not fabricated. tools/list and initialize both return HTTP 401
  {"code":"MISSING_CREDENTIALS"} without a bearer token, so the live tool set and
  its inputSchemas require an authenticated OAuth introspection against a DeepIP
  customer tenant. DeepIP publishes no llms.txt and no public tool catalogue, and
  its API reference (docs.deepip.ai) is behind a ReadMe login, so there is no
  second-hand list to fall back on. Recording zero tools is the honest result;
  any tool names here would be invented.
